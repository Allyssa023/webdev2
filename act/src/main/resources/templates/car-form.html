<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${formTitle}">Car Form</title>
</head>
<body>
<h1 th:text="${formTitle}">Car Form</h1>

<form th:action="@{${actionUrl}}" th:object="${car}" method="post">
    License Plate: <input type="text" th:field="*{licensePlateNumber}" required/><br/><br/>
    Make: <input type="text" th:field="*{make}" required/><br/><br/>
    Model: <input type="text" th:field="*{model}" required/><br/><br/>
    Year: <input type="number" th:field="*{year}" required/><br/><br/>
    Color: <input type="text" th:field="*{color}" required/><br/><br/>

    Body Type:
    <select th:field="*{bodyType}">
        <option value="Sedan">Sedan</option>
        <option value="SUV">SUV</option>
        <option value="Hatchback">Hatchback</option>
    </select><br/><br/>

    Engine Type:
    <select th:field="*{engineType}">
        <option value="Gasoline">Gasoline</option>
        <option value="Diesel">Diesel</option>
        <option value="Electric">Electric</option>
        <option value="Hybrid">Hybrid</option>
    </select><br/><br/>

    Transmission:
    <select th:field="*{transmission}">
        <option value="Automatic">Automatic</option>
        <option value="Manual">Manual</option>
    </select><br/><br/>

    <button type="submit">Submit</button>
</form>
<br><br>
<a href="/">Back to list</a>

</body>
</html>
