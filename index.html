<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Management</title>
  <script defer src="/js/main.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-black to-gray-800 min-h-screen py-12 px-4">

  <!-- =================== LOGIN / REGISTER SECTION =================== -->
  <div id="loginSection" class="max-w-md mx-auto">
    <div class="bg-gradient-to-br from-gray-900 to-black border-2 border-red-600 rounded-2xl p-8 shadow-2xl shadow-red-900/50">
      <h1 class="text-44xl font-black text-white mt-2 text-center">Car</h1>
      <p class="text-gray-400 text-sm text-center mb-8">Login to manage your cars</p>

      <h2 class="text-2xl font-bold text-white mb-6">Sign In</h2>
      <form id="loginForm" onsubmit="login(event)" class="space-y-4">
        <input type="text" id="username" placeholder="Username" required
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">
        <input type="password" id="password" placeholder="Password" required
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">
        <button type="submit"
          class="w-full bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-bold shadow-lg shadow-red-900/50 hover:shadow-xl hover:shadow-red-900/70 transition">
          Login
        </button>
      </form>

      <p class="text-gray-400 text-center mt-4">
        Don't have an account?
        <button onclick="toggleRegister(true)" class="text-red-600 hover:text-red-500 font-bold">Register</button>
      </p>
    </div>
  </div>

  <!-- =================== REGISTER SECTION =================== -->
  <div id="registerSection" class="hidden max-w-md mx-auto">
    <div class="bg-gradient-to-br from-gray-900 to-black border-2 border-red-600 rounded-2xl p-8 shadow-2xl shadow-red-900/50">
      <h1 class="text-4xl font-black text-white mb-2 text-center">Car Inventory</h1>
      <p class="text-gray-400 text-sm text-center mb-8">Create a new account</p>

      <h2 class="text-2xl font-bold text-white mb-6">Register</h2>
      <form id="registerForm" onsubmit="register(event)" class="space-y-4">
        <input type="text" id="regUsername" placeholder="Username" required
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">
        <input type="password" id="regPassword" placeholder="Password" required
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">
        <button type="submit"
          class="w-full bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-bold shadow-lg shadow-red-900/50 hover:shadow-xl hover:shadow-red-900/70 transition">
          Create Account
        </button>
      </form>

      <p class="text-gray-400 text-center mt-4">
        Already have an account?
        <button onclick="toggleRegister(false)" class="text-red-600 hover:text-red-500 font-bold">Login</button>
      </p>
    </div>
  </div>

  <!-- =================== CAR MANAGEMENT SECTION =================== -->
  <div id="carSection" class="hidden max-w-7xl mx-auto">
    <div class="bg-gradient-to-r from-gray-900 to-black border-t-4 border-red-600 rounded-xl p-8 mb-8 shadow-2xl">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-4xl font-black text-white mb-2">Car Inventory</h1>
          <p class="text-gray-400 text-sm">Manage your car collection with ease</p>
        </div>
        <div class="flex items-center gap-4">
          <button onclick="openModal()" 
            class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-lg font-bold shadow-lg shadow-red-900/50 hover:shadow-xl hover:shadow-red-900/70 transform hover:scale-105 transition-all">
            + Add Car
          </button>
          <button onclick="logout()" 
            class="bg-gray-800 hover:bg-gray-700 text-white px-6 py-3 rounded-lg font-bold border border-gray-700 transition">
            Logout
          </button>
        </div>
      </div>
    </div>

    <div class="bg-gray-900 rounded-xl overflow-hidden shadow-2xl border border-gray-800">
      <div class="overflow-x-auto">
        <table class="w-full text-white">
          <thead>
            <tr class="bg-red-600">
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">ID</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Plate</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Make</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Model</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Year</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Color</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Body</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Engine</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Transmission</th>
              <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody id="carTableBody" class="divide-y divide-gray-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- =================== MODAL (ADD / EDIT CAR) =================== -->
  <div id="formSection" class="hidden fixed inset-0 bg-black bg-opacity-80 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-gradient-to-br from-gray-900 to-black border-2 border-red-600 rounded-2xl p-8 w-full max-w-md shadow-2xl shadow-red-900/50">
      <div class="flex items-center justify-between mb-6">
        <h2 id="modalTitle" class="text-3xl font-black text-white">Add New Car</h2>
        <button onclick="closeModal()" class="text-gray-500 hover:text-red-600 text-3xl font-bold transition">&times;</button>
      </div>

      <form id="carForm" onsubmit="saveCar(event)" class="space-y-4">
        <input type="hidden" id="carId">

        <input type="text" id="make" placeholder="Make" required 
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">
        <input type="text" id="model" placeholder="Model" required 
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">
        <input type="number" id="year" placeholder="Year" required 
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">
        <input type="text" id="licensePlate" placeholder="License Plate" required 
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">
        <input type="text" id="color" placeholder="Color" required 
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none placeholder-gray-500 transition">

        <select id="bodyType" required 
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none transition">
          <option value="">Body Type</option>
          <option value="Sedan">Sedan</option>
          <option value="SUV">SUV</option>
          <option value="Hatchback">Hatchback</option>
          <option value="Truck">Truck</option>
          <option value="Coupe">Coupe</option>
        </select>

        <select id="engineType" required 
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none transition">
          <option value="">Engine Type</option>
          <option value="Gasoline">Gasoline</option>
          <option value="Diesel">Diesel</option>
          <option value="Electric">Electric</option>
          <option value="Hybrid">Hybrid</option>
        </select>

        <select id="transmission" required 
          class="w-full p-3 bg-black text-white border-2 border-gray-700 rounded-lg focus:border-red-600 focus:outline-none transition">
          <option value="">Transmission</option>
          <option value="Automatic">Automatic</option>
          <option value="Manual">Manual</option>
        </select>

        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeModal()" 
            class="flex-1 bg-gray-800 hover:bg-gray-700 text-white px-6 py-3 rounded-lg font-bold border border-gray-700 transition">
            Cancel
          </button>
          <button type="submit" 
            class="flex-1 bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-bold shadow-lg shadow-red-900/50 hover:shadow-xl hover:shadow-red-900/70 transition">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
