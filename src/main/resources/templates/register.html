<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #e2e8f0;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                    radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                    radial-gradient(circle at 40% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .register-container {
            background: rgba(30, 41, 59, 0.85);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow:
                    0 20px 40px rgba(0, 0, 0, 0.3),
                    0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #3b82f6, #06b6d4, #10b981, transparent);
            animation: glow 3s ease-in-out infinite alternate;
        }

        h1 {
            color: #f1f5f9;
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            position: relative;
        }

        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981);
            margin: 15px auto;
            border-radius: 1px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #f1f5f9;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(15, 23, 42, 0.85);
            color: #e2e8f0;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #94a3b8;
            font-style: normal; /* removed italic */
            font-size: 12px;    /* smaller font size */
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow:
                    0 0 0 3px rgba(59, 130, 246, 0.1),
                    0 8px 25px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.95);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow:
                    0 8px 32px rgba(59, 130, 246, 0.25),
                    0 1px 0 rgba(255, 255, 255, 0.1) inset;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }

        .login-link {
            display: block;
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            color: #60a5fa;
            text-decoration: none;
            transition: color 0.3s;
        }

        .login-link:hover {
            color: #93c5fd;
        }

        .login-link .underline {
            text-decoration: underline;
            font-weight: 600;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
            to { box-shadow: 0 0 20px rgba(59, 130, 246, 0.8), 0 0 30px rgba(6, 182, 212, 0.5); }
        }
    </style>
</head>
<body>
<div class="register-container">
    <h1>Register</h1>
    <form th:action="@{/register}" method="post">
        <div>
            <label>Username:</label>
            <input type="text" name="username" placeholder="Enter username" required/>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter password" required/>
        </div>
        <button type="submit" class="btn">Register</button>
    </form>

    <a th:href="@{/login}" class="login-link">
        Already have an account? <span class="underline">Login Here.</span>
    </a>
</div>
</body>
</html>
