<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Car</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>Edit Car</h1>

    <form th:action="@{'/update/' + ${car.id}}" th:object="${car}" method="post" class="form-container">
        <label for="make">Make:</label>
        <input type="text" id="make" th:field="*{make}" required>

        <label for="model">Model:</label>
        <input type="text" id="model" th:field="*{model}" required>

        <label for="year">Year:</label>
        <input type="number" id="year" th:field="*{year}" required>

        <label for="color">Color:</label>
        <input type="text" id="color" th:field="*{color}" required>

        <label for="bodyType">Body Type:</label>
        <input type="text" id="bodyType" th:field="*{bodyType}">

        <label for="engineType">Engine Type:</label>
        <input type="text" id="engineType" th:field="*{engineType}">

        <label for="licensePlate">License Plate:</label>
        <input type="text" id="licensePlate" th:field="*{licensePlate}" required>

        <label for="transmission">Transmission:</label>
        <input type="text" id="transmission" th:field="*{transmission}">

        <div class="form-actions">
            <button type="submit" class="btn edit-btn">Update</button>
            <a href="/" class="btn">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
