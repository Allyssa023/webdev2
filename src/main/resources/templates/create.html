<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Car</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>Add New Car</h1>

    <form th:action="@{/save}" th:object="${car}" method="post" class="form-container">

        <label for="make">Make:</label>
        <input type="text" id="make" th:field="*{make}">
        <div class="error" th:if="${#fields.hasErrors('make')}" th:errors="*{make}"></div>

        <label for="model">Model:</label>
        <input type="text" id="model" th:field="*{model}">
        <div class="error" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>

        <label for="year">Year:</label>
        <input type="number" id="year" th:field="*{year}">
        <div class="error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>

        <label for="color">Color:</label>
        <input type="text" id="color" th:field="*{color}">
        <div class="error" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></div>

        <label for="bodyType">Body Type:</label>
        <select id="bodyType" th:field="*{bodyType}">
            <option value="">Select</option>
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="Hatchback">Hatchback</option>
            <option value="Truck">Truck</option>
            <option value="Coupe">Coupe</option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('bodyType')}" th:errors="*{bodyType}"></div>

        <label for="engineType">Engine Type:</label>
        <select id="engineType" th:field="*{engineType}">
            <option value="">Select</option>
            <option value="Gasoline">Gasoline</option>
            <option value="Diesel">Diesel</option>
            <option value="Electric">Electric</option>
            <option value="Hybrid">Hybrid</option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('engineType')}" th:errors="*{engineType}"></div>

        <label for="transmission">Transmission:</label>
        <select id="transmission" th:field="*{transmission}">
            <option value="">Select</option>
            <option value="Automatic">Automatic</option>
            <option value="Manual">Manual</option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('transmission')}" th:errors="*{transmission}"></div>

        <label for="licensePlate">License Plate:</label>
        <input type="text" id="licensePlate" th:field="*{licensePlate}">
        <div class="error" th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}"></div>

        <div class="form-actions">
            <button type="submit" class="btn add-btn">Save</button>
            <a href="/" class="btn">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
