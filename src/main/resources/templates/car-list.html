<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Inventory</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>Car List</h1>

    <div class="button-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <a href="/create" class="btn add-btn">+ Add New Car</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn logout-btn">Logout</button>
        </form>
    </div>

    <table class="car-list">
        <thead>
        <tr>
            <th>ID</th>
            <th>Make</th>
            <th>Model</th>
            <th>Year</th>
            <th>Color</th>
            <th>Body Type</th>
            <th>Engine Type</th>
            <th>Transmission</th>
            <th>License Plate</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="car : ${cars}">
            <td th:text="${car.id}"></td>
            <td th:text="${car.make}"></td>
            <td th:text="${car.model}"></td>
            <td th:text="${car.year}"></td>
            <td th:text="${car.color}"></td>
            <td th:text="${car.bodyType}"></td>
            <td th:text="${car.engineType}"></td>
            <td th:text="${car.transmission}"></td>
            <td th:text="${car.licensePlate}"></td>
            <td>
                <div class="action-buttons">
                    <a th:href="@{'/edit/' + ${car.id}}" class="btn edit-btn">Edit</a>
                    <a th:href="@{'/delete/' + ${car.id}}" class="btn delete-btn"
                       onclick="return confirm('Are you sure you want to delete this car?');">Delete</a>
                </div>

            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
